name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
            targets: ""
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-24.04
            args: --bundles appimage,deb
            targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev libxdo-dev
      - run: npm install
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: OmniDesk v__VERSION__
          releaseBody: |
            **Download:** [Windows](https://github.com/Aristotlev/omnidesk/releases/latest/download/OmniDesk-Windows.exe) · [Mac](https://github.com/Aristotlev/omnidesk/releases/latest/download/OmniDesk-Mac.dmg) · [Linux](https://github.com/Aristotlev/omnidesk/releases/latest/download/OmniDesk-Linux.AppImage)

            Install OmniDesk on every computer you want on your desk, then pair them with the 6-digit code.

            Windows 10/11: run OmniDesk-Windows.exe. If you see "Windows protected your PC", click More info, then Run anyway.
            Mac (macOS 11+, Apple silicon and Intel): open OmniDesk-Mac.dmg and drag OmniDesk to Applications. If macOS can't verify the developer, open System Settings → Privacy & Security and click Open Anyway.
            Linux: make OmniDesk-Linux.AppImage executable and run it, or install the .deb.

            Already installed? OmniDesk updates itself.
          releaseDraft: false
          prerelease: false
          retryAttempts: 3
          args: ${{ matrix.args }}
      # Same file under a name that never changes, so download links always point at the latest version.
      - name: Attach fixed-name download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$RUNNER_OS" in
            Windows) SRC=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n1); NAME=OmniDesk-Windows.exe ;;
            macOS)   SRC=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n1); NAME=OmniDesk-Mac.dmg ;;
            Linux)   SRC=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1); NAME=OmniDesk-Linux.AppImage ;;
          esac
          cp "$SRC" "$NAME"
          gh release upload "v$VERSION" "$NAME" --clobber -R "${{ github.repository }}"
