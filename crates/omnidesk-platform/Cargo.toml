[package]
name = "omnidesk-platform"
version.workspace = true
license = "MIT"
edition.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
fast_image_resize = "6.1.0"
gethostname = "1.1.0"
jpeg-encoder = { version = "0.7", features = ["simd"] }
omnidesk-proto = { version = "0.1.0", path = "../omnidesk-proto" }
thiserror = "2.0.21"
tracing = "0.1.44"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
xcap = "0.9"
enigo = "0.6"
arboard = { version = "3", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
