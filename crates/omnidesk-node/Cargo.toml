[package]
name = "omnidesk-node"
version.workspace = true
license = "MIT"
edition.workspace = true
authors.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
omnidesk-discovery = { version = "0.1.0", path = "../omnidesk-discovery" }
omnidesk-link = { version = "0.1.0", path = "../omnidesk-link" }
omnidesk-platform = { version = "0.1.0", path = "../omnidesk-platform" }
omnidesk-proto = { version = "0.1.0", path = "../omnidesk-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "io-std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[features]
default = ["cli"]
# The `omnideskd` terminal program.
cli = ["dep:clap", "dep:tracing-subscriber"]

[[bin]]
name = "omnideskd"
required-features = ["cli"]
