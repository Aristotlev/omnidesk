[package]
name = "omnidesk-link"
version.workspace = true
license = "MIT"
edition.workspace = true
authors.workspace = true

[dependencies]
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.12"
hmac = "0.12"
omnidesk-proto = { version = "0.1.0", path = "../omnidesk-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
snow = "0.10.0"
spake2 = "0.4.0"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "net", "time", "sync", "rt", "macros"] }
zeroize = "1.9.1"
