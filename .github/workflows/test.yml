name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev libxdo-dev
      - name: Core tests (encryption, pairing, Flow, two devices end to end)
        run: cargo test --workspace
      - name: Lint
        run: cargo clippy --workspace --all-targets
      - name: Interface
        run: |
          npm install
          npm run build
      - name: App compiles
        run: cargo check --manifest-path src-tauri/Cargo.toml
      # Proves screen capture works on a real Windows desktop: the picture is attached to the run.
      - name: Screen capture
        if: runner.os == 'Windows'
        continue-on-error: true
        run: cargo run -p omnidesk-platform --example shot -- screen-${{ runner.os }}.jpg
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: screen-${{ runner.os }}
          path: screen-*.jpg
          if-no-files-found: ignore
